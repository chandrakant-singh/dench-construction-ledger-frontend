<div class="row">
  <div class="col-12">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Email</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let supervisor of supervisors">
          <td>{{ supervisor.name }}</td>
          <td>{{ supervisor.email }}</td>
        </tr>
        </tbody>
      </table>
  </div>
</div>
