<div class="row">
  <div class="col-12 col-sm-8 col-md-4">
    <input
      type="text"
      class="form-control mb-3 form-control form-control-sm"
      placeholder="Search..."
      [(ngModel)]="searchTerm"
      (input)="onSearchInputChange()"
      />
  </div>
  <div class="col mb-2">
    <button class="btn btn-primary btn-sm float-end" (click)="createEntry()">Create Entry</button>
    <button class="btn btn-warning btn-sm float-end mx-1 mx-sm-2" (click)="exportToExcel()">Download&nbsp;as&nbsp;Excel</button>
    <button class="btn btn-primary btn-sm float-end" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterSidebar">Filter</button>
  </div>
  <div class="col-12" *ngIf="filteredRows && ledgerData.length; else loadingTemplate">
    <app-ngx-datatable
      [rows]="filteredRows"
      [columns]="ledgerColumns"
      header="Balance Ledger"
      [headerHelperText]="`Balance:  ${this.lastLedger?.balance || 0}`"
      (rowEdit)="onEditLedger($event)">
    </app-ngx-datatable>
  </div>
</div>

<ng-template #loadingTemplate>
  <div class="d-flex justify-content-center align-items-center" style="height: 200px;">
    <div class="spinner-border" role="status" aria-hidden="true"></div>
  </div>
</ng-template>

<ng-container *ngIf="showLedgerForm">
  <app-create-balance-ledger
    (closeLedgerForm)="closeLedgerForm($event)"
  ></app-create-balance-ledger>
</ng-container>

<!-- Sidebar -->
<div
  class="offcanvas offcanvas-end custom-offcanvas-width"
  tabindex="-1"
  id="filterSidebar"
  aria-labelledby="filterSidebarLabel"
>
  <div class="offcanvas-header">
    <h5 id="filterSidebarLabel">Filter</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <app-generic-filter
      [filters]="['credit', 'item']"
      [options]="{ item: items }"
      (filterChanged)="onFilterChanged($event)">
    </app-generic-filter>
  </div>
</div>
