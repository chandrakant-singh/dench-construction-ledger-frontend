<div class="row">
  <!-- Search Input -->
  <div class="col-12 col-sm-8 col-md-4">
    <input type="text" class="form-control mb-3 form-control form-control-sm" placeholder="Search..."
      [(ngModel)]="searchTerm" (input)="onSearchInputChange()" />
  </div>
  <!-- Action Buttons -->
  <div class="col mb-2">
    <div class="float-end">
      <!-- Edit/View Toggle -->
      <button class="btn btn-primary btn-sm mx-1"
              type="button"
              (click)="isEditMode ? preview() : cancelPreviewMode()">
        {{ isEditMode ? 'View' : 'Back' }}
      </button>

      <!-- Create Entry Button -->
      <button *ngIf="isEditMode"
              class="btn btn-primary btn-sm mx-1"
              type="button"
              (click)="createEntry()">
        Create Entry
      </button>

      <!-- Export Dropdown -->
      <app-export-dropdown 
        *ngIf="!isEditMode"
        [data]="filteredRows"
        [fullData]="ledgerData"
        [config]="currentExportConfig"
        (exportStarted)="onExportStarted($event)"
        (exportCompleted)="onExportCompleted($event)">
      </app-export-dropdown>

      <!-- Filter Button -->
      <button class="btn btn-primary btn-sm mx-1"
              type="button"
              data-bs-toggle="offcanvas"
              data-bs-target="#filterSidebar">
        Filter
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="col-12" *ngIf="(filteredRows && ledgerData.length) || !isLoading; else loadingTemplate">
    <div class="card mb-3">
      <!-- Card Header -->
      <div class="card-header d-flex justify-content-between align-items-center p-2">
        <strong class="small">Expenditure Ledger</strong>
        <strong class="text-muted small">Balance:
          <span *ngIf="isEditMode">
            <span *ngIf="todaysBalance !== null" [ngClass]="todaysBalance > 0 ? 'text-success' : 'text-danger'">
              {{ todaysBalance }}
            </span>
            <span *ngIf="todaysBalance === null" class="text-muted">0</span>
          </span>
          <span *ngIf="!isEditMode">
            <span *ngIf="lastLedger" [ngClass]="lastLedger.balance > 0 ? 'text-success' : 'text-danger'">{{ lastLedger.balance || 0 }}</span>
            <span *ngIf="!lastLedger" class="text-muted">0</span>
          </span>
        </strong>
      </div>

      <!-- Card Body with Data Table -->
      <div class="card-body p-0">
        <div class="table-responsive">
          <!-- Edit Mode: Accordion Table -->
          <div class="accordion" id="ledgerAccordion" *ngIf="isEditMode; else fullTable">
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button p-2" [class.collapsed]="!isAccordionOpen" (click)="toggleAccordion()">
                  <small>Today's Entries ({{todayEntries.length}})</small>
                </button>
              </h2>
              <div class="accordion-collapse collapse" [class.show]="isAccordionOpen">
                <div class="accordion-body p-0 m-0">
                  <div *ngIf="todayEntries.length === 0" class="text-center py-3 text-muted">
                    <small>No entries created today</small>
                  </div>
                  <ngx-datatable *ngIf="todayEntries.length > 0" class="bootstrap ledger-table"
                      [rows]="filteredRows"
                      [columns]="columns"
                      [columnMode]="'standard'"
                      [headerHeight]="30"
                      [footerHeight]="30"
                      [scrollbarH]="true"
                      [scrollbarV]="true"
                      [messages]="{ emptyMessage: 'No records found', totalMessage: 'total', selectedMessage: 'selected' }"
                      [rowHeight]="35" [limit]="10">
                    </ngx-datatable>
                </div>
              </div>
            </div>
          </div>

          <!-- View Mode: Full Table -->
          <ng-template #fullTable>
            <ngx-datatable class="bootstrap ledger-table"
              [rows]="filteredRows"
              [columns]="columns"
              [columnMode]="'standard'"
              [headerHeight]="30"
              [footerHeight]="30"
              [scrollbarH]="true"
              [scrollbarV]="true"
              [messages]="{ emptyMessage: 'No records found', totalMessage: 'total', selectedMessage: 'selected' }"
              [rowHeight]="35" [limit]="10">
            </ngx-datatable>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Status Column Template -->
<ng-template #statusTpl let-row="row">

  <ng-container *ngIf="row.status === 'pending'; else approved">
    <span class="badge" role="button" (click)="onStatusChange(row)" [ngClass]="{
      'bg-success': row.status === 'approved',
      'bg-warning text-dark': row.status === 'pending',
      'bg-danger': row.status === 'rejected'
    }">
      {{ row.status | titlecase }}
    </span>
  </ng-container>

  <ng-template #approved>
    <span [ngClass]="{
      'text-success': row.status === 'approved',
      'text-warning': row.status === 'pending',
      'text-danger': row.status === 'rejected'
    }">
      {{ row.approvedByName }}
    </span>
  </ng-template>

</ng-template>

<!-- Action Column Template -->
<ng-template #actionTpl let-row="row">
  <button class="btn btn-xs btn-warning me-2" (click)="onEdit(row)" [disabled]="row.status === 'approved'">
    <i class="bi bi-pencil"></i> Edit
  </button>
  <button *ngIf="canDeleteEntries" class="btn btn-xs btn-danger me-2" (click)="onDelete(row)">
    <i class="bi bi-trash"></i> Delete
  </button>
</ng-template>

<!-- Credit/Debit Column Template -->
<ng-template #creditDebit let-row="row">

  <ng-container *ngIf="row.credit; else debit">
    <span class="text-success">
      {{ row.credit || '-' }}
    </span>
  </ng-container>

  <ng-template #debit>
    <span class="text-danger">
      {{ row.debit || '-' }}
    </span>
  </ng-template>

</ng-template>

<!-- Loading Template -->
<ng-template #loadingTemplate>
  <div class="d-flex justify-content-center align-items-center" style="height: 200px;">
    <div class="spinner-border" role="status" aria-hidden="true"></div>
  </div>
</ng-template>

<!-- Ledger Form Modal -->
<ng-container *ngIf="showLedgerForm">
  <app-create-ledger-entry (closeLedgerForm)="closeLedgerForm($event)"></app-create-ledger-entry>
</ng-container>

<!-- Filter Sidebar -->
<div class="offcanvas offcanvas-end custom-offcanvas-width" tabindex="-1" id="filterSidebar"
  aria-labelledby="filterSidebarLabel">
  <div class="offcanvas-header">
    <h5 id="filterSidebarLabel">Filter</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
                    <app-generic-filter [filters]="['credit', 'debit', 'createdBy', 'status', 'dateFilter']" [options]="{ users: users, statusOptions: statusOptions }"
                  (filterChanged)="onFilterChanged($event)">
                </app-generic-filter>
  </div>
</div>
