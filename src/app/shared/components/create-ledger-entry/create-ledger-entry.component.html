<div class="card">
  <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
    <span>{{ existingLedger ? 'Update' : 'Create New' }} Ledger Entry</span>
    <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="onCancel()"></button>
  </div>
  <div class="card-body" *ngIf="appUser; else loadingTemplate">
    <form [formGroup]="ledgerForm" (ngSubmit)="onSubmit()">
      <div class="row g-2">

        <div class="col-lg-4 col-md-6 col-6">
          <label class="form-label font lh-1 fs-smaller">Balance</label>
          <input type="number" class="form-control form-control-sm" formControlName="balance" [readonly]="!isAdmin">
        </div>

        <div class="col-lg-4 col-md-6 col-6 fs-smaller" *ngIf="isAdmin">
          <label class="form-label lh-1">Date</label>
          <input type="date" class="form-control form-control-sm" formControlName="date">
        </div>

        <div class="col-lg-4 col-md-6 col-6 fs-smaller">
          <label class="form-label lh-1">Credit</label>
          <input type="number" 
                 class="form-control form-control-sm" 
                 formControlName="credit" 
                 (input)="calculateBalance()"
                 placeholder="Enter credit amount">
        </div>

        <div class="col-lg-4 col-md-6 col-6 fs-smaller">
          <label class="form-label lh-1">Debit</label>
          <input type="number" 
                 class="form-control form-control-sm" 
                 formControlName="debit" 
                 (input)="calculateBalance()"
                 placeholder="Enter debit amount">
        </div>

        <div class="col-lg-4 col-md-6 fs-smaller">
          <label class="form-label lh-1">Mode of Payment</label>
          <select class="form-select form-select-sm" formControlName="paymentMode">
            <option value="">Select</option>
            <option value="cash">Cash</option>
            <option value="bank">Bank Transfer</option>
            <option value="cheque">Cheque</option>
          </select>
        </div>

        <div class="col-lg-4 col-md-6 fs-smaller">
          <label class="form-label lh-1">Description</label>
          <textarea type="text" 
                    class="form-control form-control-sm" 
                    formControlName="description" 
                    rows="2"
                    placeholder="Enter description (optional)"></textarea>
        </div>

        <div class="col-lg-4 col-md-6 fs-smaller">
          <label class="form-label lh-1">Hint By</label>
          <input type="text" 
                 class="form-control form-control-sm" 
                 formControlName="hintBy" 
                 placeholder="Enter hint by name"/>
        </div>

        <!-- <div class="col-lg-4 col-md-6 fs-smaller" *ngIf="isAdmin">
          <label class="form-label lh-1">Deposited By</label>
          <select class="form-select" formControlName="depositedBy" (change)="onUserChange($event, 'depositedBy')">
            <option value="">Select Users</option>
            <option *ngFor="let user of allUsers" [value]="user.uid">
              {{ user.name }}
            </option>
          </select>
        </div>

        <div class="col-lg-4 col-md-6 fs-smaller" *ngIf="isAdmin">
          <label class="form-label lh-1">Debited By</label>
          <select class="form-select" formControlName="debitedBy" (change)="onUserChange($event, 'debitedBy')">
            <option value="">Select Users</option>
            <option *ngFor="let user of allUsers" [value]="user.uid">
              {{ user.name }}
            </option>
          </select>
        </div> -->

        <!-- <div class="col-lg-4 col-md-6 fs-smaller" *ngIf="isAdmin">
          <label class="form-label">Approve lh-1d By</label>
          <input type="text" class="form-control" formControlName="approvedBy">
        </div> -->

        <div class="col-lg-4 col-md-6 fs-smaller col-6" *ngIf="isAdmin">
          <label class="form-label fro lh-1">Status</label>
          <select class="form-select form-select-sm" formControlName="status">
            <option value="">Select</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>

      <!-- Form-level validation errors -->
      <!-- <div class="row" *ngIf="hasFormErrors()">
        <div class="col-12">
          <div class="alert alert-danger alert-sm" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <strong>Please fix the following errors:</strong>
            <ul class="mb-0 mt-2">
              <li *ngFor="let error of getFormErrors()">{{ error }}</li>
            </ul>
          </div>
        </div>
      </div> -->

      <div class="mt-4 text-end">
        <!-- <button class="btn btn-primary" type="submit" [disabled]="ledgerForm.invalid">
          {{ existingLedger? 'Update' : 'Create' }} Entry
        </button> -->
        <app-loading-button [btnClass]="'btn btn-primary btn-sm'" [isLoading]="isLoading" [btnDisable]="ledgerForm.invalid"
          [label]="(existingLedger ? 'Update' : 'Create') + ' Entry'" [type]="'submit'">
        </app-loading-button>
        <button class="btn btn-secondary ms-2 btn-sm" type="button" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<ng-template #loadingTemplate>
  <div class="d-flex justify-content-center align-items-center" style="height: 200px;">
    <div class="spinner-border" role="status" aria-hidden="true"></div>
  </div>
</ng-template>
