<!-- toast-container.component.html -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1200">
  <div
    *ngFor="let toast of toastService.toasts"
    class="toast align-items-center border-0 show mb-2"
    [ngClass]="toast.classes || 'text-bg-primary'"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="d-flex">
      <div class="toast-body">
        {{ toast.message }}
      </div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        (click)="toastService.remove(toast)"
        aria-label="Close"
      ></button>
    </div>
  </div>
</div>
