<form class="row g-2 align-items-end" [formGroup]="filterForm" (ngSubmit)="applyFilters()">
  <ng-container *ngFor="let field of filters">

    <div class="col-12" *ngIf="field === 'item'">
      <label class="form-label">Select Item</label>
      <select class="form-select form-select-sm" [formControlName]="field">
        <option value="">All</option>
        <option *ngFor="let item of options.item || []" [value]="item.id">{{ item.name }}</option>
      </select>
    </div>

    <div class="col-12" *ngIf="field === 'mainCategory'">
      <label class="form-label">Main Category</label>
      <select class="form-select form-select-sm" [formControlName]="field">
        <option value="">All</option>
        <option *ngFor="let category of options.mainCategory || []" [value]="category">{{ category }}</option>
      </select>
    </div>

    <div class="col-12" *ngIf="field === 'party'">
      <label class="form-label">Party</label>
      <select class="form-select form-select-sm" [formControlName]="field">
        <option value="">All</option>
        <option *ngFor="let item of options.party || []" [value]="item">{{ item }}</option>
      </select>
    </div>

    <div class="col-12" *ngIf="field === 'subCategory'">
      <label class="form-label">Sub Category</label>
      <select class="form-select form-select-sm" [formControlName]="field">
        <option value="">All</option>
        <option *ngFor="let item of options.subCategory || []" [value]="item">{{ item }}</option>
      </select>
    </div>

    <div class="col-12" *ngIf="field === 'credit'">
      <label class="form-label">Credit (result will be greater than)</label>
      <input type="number" class="form-control form-control-sm" [formControlName]="field">
    </div>

    <div class="col-12" *ngIf="field === 'debit'">
      <label class="form-label">Debit (result will be greater than)</label>
      <input type="number" class="form-control form-control-sm" [formControlName]="field">
    </div>

    <div class="col-12" *ngIf="field === 'createdBy'">
      <label class="form-label">Created By</label>
      <select class="form-select form-select-sm" [formControlName]="field">
        <option value="">All</option>
        <option *ngFor="let user of options.users || []" [value]="user.uid">{{ user.name }}</option>
      </select>
    </div>

    <div class="col-12" *ngIf="field === 'status'">
      <label class="form-label">Status</label>
      <select class="form-select form-select-sm" [formControlName]="field">
        <option value="">All</option>
        <option *ngFor="let status of options.statusOptions || []" [value]="status.value">{{ status.label }}</option>
      </select>
    </div>

    <div class="col-12" *ngIf="field === 'dateFilter'">
      <label class="form-label">Date Filter</label>
      <select class="form-select form-select-sm" [formControlName]="'dateFilterType'" (change)="onDateFilterTypeChange($event)">
        <option value="">All Dates</option>
        <option value="today">Today</option>
        <option value="last7days">Last 7 Days</option>
        <option value="custom">Custom Date Range</option>
      </select>
      
      <!-- Custom Date Range Inputs -->
      <div *ngIf="filterForm.get('dateFilterType')?.value === 'custom'" class="mt-2">
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label text-muted small">From Date</label>
            <input type="date" class="form-control form-control-sm" [formControlName]="'fromDate'">
          </div>
          <div class="col-6">
            <label class="form-label text-muted small">To Date</label>
            <input type="date" class="form-control form-control-sm" [formControlName]="'toDate'">
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Buttons -->
  <div class="col-12 d-flex gap-2">
    <button class="btn btn-primary w-100 btn-sm" type="submit">Apply</button>
    <button class="btn btn-secondary w-100 btn-sm" type="button" (click)="resetFilters()">Reset</button>
  </div>
</form>
