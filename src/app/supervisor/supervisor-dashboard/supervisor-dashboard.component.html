<div class="row">
  <div class="col-8 col-md-4">
    <input
    type="text"
    class="form-control mb-3 form-control form-control-sm"
    placeholder="Search..."
    [(ngModel)]="searchTerm"
    (input)="filterRows()" />
  </div>
  <div class="col">
    <button class="btn btn-primary btn-sm float-end" (click)="createEntry()">Create Entry</button>
  </div>
  <div class="col-12">
    <div class="table-responsive vh-100" style="height: 500px; display: flex; flex-direction: column;">
      <ngx-datatable
        class="bootstrap ledger-table"
        [rows]="rows"
        [columns]="columns"
        [columnMode]="'standard'"
        [headerHeight]="30"
        [footerHeight]="30"
        [scrollbarH]="true"
        [scrollbarV]="true"
        [rowHeight]="35"
        [messages]="{ emptyMessage: 'No records found', totalMessage: 'total', selectedMessage: 'selected' }"
        [limit]="10">
      </ngx-datatable>
    </div>
  </div>
</div>

<ng-template #statusTpl let-row="row">
  <span
    class="badge"
    [ngClass]="{
      'bg-success': row.status === 'approved',
      'bg-warning text-dark': row.status === 'pending',
      'bg-danger': row.status === 'rejected'
    }">
    {{ row.status | titlecase }}
  </span>
</ng-template>
