<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2 class="text-center mb-4">Sign Up</h2>
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label>Name</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Full Name">
        </div>

        <div class="mb-3">
          <label>Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="Email">
        </div>

        <div class="mb-3">
          <label>Password</label>
          <input type="password" class="form-control" formControlName="password" placeholder="Password">
        </div>

        <div class="mb-3">
          <label>Confirm Password</label>
          <input type="password" class="form-control" formControlName="confirmPassword" placeholder="Confirm Password">
        </div>

        <button type="submit" class="btn btn-success w-100" [disabled]="signupForm.invalid">Sign Up</button>
      </form>
    </div>
  </div>
</div>
